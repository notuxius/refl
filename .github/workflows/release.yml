name: Release Windows executable

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching shelf_version.py
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release version
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Run a manual release on main'
          }
          $version = python -c "from shelf_version import __version__; print(__version__)"
          if ($env:RELEASE_TAG -cne "v$version") { throw "Tag must match shelf_version.py" }
          $notes = Get-Content -LiteralPath "release-notes/$env:RELEASE_TAG.md" -Raw -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "Release notes are empty for $env:GITHUB_REF_NAME" }
      - name: Run tests
        run: python run_tests.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Build executable
        run: python -m PyInstaller --noconfirm Relf.spec
      - name: Push release tag
        if: github.event_name == 'workflow_dispatch'
        run: 'git push origin "${env:GITHUB_SHA}:refs/tags/$env:RELEASE_TAG"'
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" "dist/Relf.exe" --verify-tag --notes-file "release-notes/$env:RELEASE_TAG.md" --title "Relf $env:RELEASE_TAG"
